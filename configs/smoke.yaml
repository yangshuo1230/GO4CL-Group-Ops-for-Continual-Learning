# Short engineering / debugging config
model:
  n_layers: 3
  d_model: 64
  n_heads: 4
  d_mlp: 256
  dropout: 0.0
  activation: relu

train:
  lr: 0.001
  weight_decay: 0.1
  batch_size: 64
  max_steps: 200
  eval_every: 50
  ckpt_every: 200
  grad_clip: 1.0

data:
  n_aliases_per_pair: 1
  n_nuisance_contexts: 1
  split_ratios: [0.6, 0.2, 0.2]

task:
  rho_slot: 0.5
  rho_operand: 0.5
  rho_mod: 0.5
  task_seed: 0
  data_seed: 0
